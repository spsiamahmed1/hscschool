===== FILE: .github/workflows/build.yml =====
name: Build HSC Result APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and unzip project
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "❌ No zip file found in repo root"
            exit 1
          fi
          echo "📦 Found: $ZIP"
          mkdir -p project
          unzip -o "$ZIP" -d project

          # যদি zip-এর ভেতরে আরেকটা folder থাকে, সেটাও handle করা
          if [ ! -f project/settings.gradle ] && [ ! -f project/settings.gradle.kts ]; then
            INNER=$(find project -maxdepth 2 -type f -name "settings.gradle*" | head -n 1)
            if [ -n "$INNER" ]; then
              echo "➡️ Nested folder detected: $(dirname "$INNER")"
              mv "$(dirname "$INNER")" project_tmp
              rm -rf project
              mv project_tmp project
            fi
          fi

          if [ ! -f project/settings.gradle ] && [ ! -f project/settings.gradle.kts ]; then
            echo "❌ settings.gradle not found after unzip"
            exit 1
          fi
          echo "✅ Project ready"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate Gradle wrapper
        working-directory: project
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        working-directory: project
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSC-Result-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
===== END =====
